      <footer class="up-footer"><span>UniPulse · 学生项目概念稿 · 非学校官方服务</span><span>2026.11.20 示例数据 · 未连接模型与企微</span></footer>
    </main>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('unipulse-preview');
    const ui={accent:'#006b48',radius:10};
    const defaults={page:'home',confirmed:false,deferred:false,oldConflict:false,followup:false,quiet:true,tone:'简洁',advance:'提前 1 天',draft:'',tasks:[{id:1,title:'复习机器学习第三章',meta:'机器学习 · 预计 40 分钟',tag:'20:00 提醒',done:false},{id:2,title:'整理高数作业的错题',meta:'高等数学 · 预计 25 分钟',tag:'今日',done:false},{id:3,title:'确认英语小测范围',meta:'大学英语 · 预计 10 分钟',tag:'今日',done:false},{id:4,title:'下载课程教学大纲',meta:'机器学习 · 已完成',tag:'完成',done:true}],messages:[]};
    const saved=window.openai?.widgetState;
    const valid=['home','notices','calendar','courses','chat','settings'];
    function restore(s){const p=s?.privateContent;if(!p||!Array.isArray(p.tasks))return {...defaults,tasks:defaults.tasks.map(t=>({...t})),messages:[]};return {...defaults,...p,page:valid.includes(p.page)?p.page:'home',messages:Array.isArray(p.messages)?p.messages.slice(-8):[]};}
    let state=restore(saved);
    state.page='home';
    if(!Number.isInteger(state.timetableDay)||state.timetableDay<0||state.timetableDay>6)state.timetableDay=4;
    const weekDays=['周一','周二','周三','周四','周五','周六','周日'];
    const classPeriods=[{label:'1—2 节',start:'08:00',end:'09:35'},{label:'3—4 节',start:'10:00',end:'11:35'},{label:'5—6 节',start:'14:00',end:'15:35'},{label:'7—8 节',start:'16:00',end:'17:35'}];
    const classTemplates={math:{name:'高等数学',room:'B205',teacher:'陈老师'},ml:{name:'机器学习',room:'A101',teacher:'李老师'},english:{name:'大学英语',room:'C302',teacher:'王老师'}};
    const classes=[{id:'mon-math',day:0,period:0,kind:'math'},{id:'mon-ml',day:0,period:2,kind:'ml'},{id:'tue-en',day:1,period:1,kind:'english'},{id:'wed-en',day:2,period:0,kind:'english'},{id:'wed-math',day:2,period:1,kind:'math'},{id:'thu-math',day:3,period:0,kind:'math'},{id:'thu-ml',day:3,period:3,kind:'ml'},{id:'fri-en',day:4,period:1,kind:'english'},{id:'fri-ml',day:4,period:2,kind:'ml'}];
    const labels={home:'今日概览',notices:'通知中心',calendar:'我的日程',courses:'我的课程',chat:'AI 助手',settings:'提醒设置'};
    const view=root.querySelector('#up-view');
    const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function save(){window.openai?.setWidgetState?.({modelContent:{产品:'UniPulse 中山大学风格',当前页面:labels[state.page],改期已确认:state.confirmed,跟进已开启:state.followup,强调色:ui.accent,圆角:ui.radius},privateContent:state})?.catch(()=>{});}
    function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});}
    function toast(t){const el=root.querySelector('#up-feedback');el.textContent=t;el.hidden=false;}
    function go(p){state.page=p;root.querySelector('#up-feedback').hidden=true;render();save();}
    function greeting(title,sub){return `<div class="up-greeting"><div><h1>${title}</h1><p class="up-subtitle">${sub}</p></div><span class="up-pill">11 月 20 日 · 周五</span></div>`;}
    function classButton(c){const info=classTemplates[c.kind],p=classPeriods[c.period];return `<button type="button" class="up-class cursor-interaction" data-class="${c.id}" data-kind="${c.kind}" aria-pressed="${state.selectedClass===c.id}" aria-label="${weekDays[c.day]} ${p.start}至${p.end} ${info.name} ${info.room}">${info.name}<span>${info.room}</span></button>`;}
    function timetable(){
      const day=Number.isInteger(state.timetableDay)&&state.timetableDay>=0&&state.timetableDay<7?state.timetableDay:4;
      const selected=classes.find(c=>c.id===state.selectedClass);
      let detail=selected?`<strong>${classTemplates[selected.kind].name}</strong> · ${weekDays[selected.day]} ${classPeriods[selected.period].start}—${classPeriods[selected.period].end} · ${classTemplates[selected.kind].room} · ${classTemplates[selected.kind].teacher}`:'点击课程查看时间、教室和任课老师 · 所有课表信息均为示例';
      let grid='<div class="up-week-label">节次</div>'+weekDays.map((d,i)=>`<div class="up-week-day ${i===4?'up-today':''}">${d}${i===4?' · 今天':''}<small>11.${16+i}</small></div>`).join('');
      classPeriods.forEach((p,row)=>{grid+=`<div class="up-period"><strong>${p.label}</strong><span>${p.start}</span><span>${p.end}</span></div>`;for(let col=0;col<7;col++){const c=classes.find(c=>c.day===col&&c.period===row);grid+=`<div class="up-class-slot">${c?classButton(c):''}</div>`;}});
      const dayClasses=classes.filter(c=>c.day===day);
      const daily=dayClasses.length?dayClasses.map(c=>`<div class="up-mobile-class"><div class="up-period"><strong>${classPeriods[c.period].start}</strong><span>${classPeriods[c.period].end}</span></div>${classButton(c)}</div>`).join(''):'<p class="up-subtitle">这天没有安排课程，留一点时间给自己。</p>';
      return `<section class="up-panel up-timetable" aria-label="本周课表"><div class="up-section-head"><div class="up-timetable-title"><i data-lucide="calendar-range" aria-hidden="true"></i><h2>本周课表</h2></div><span class="up-caption">11 月 16—22 日 · 示例</span></div><div class="up-next-class"><strong>下一节 · 14:00 机器学习</strong><span>A101 · 李老师</span></div><div class="up-week-grid" aria-label="周一至周日课程安排">${grid}</div><div class="up-day-strip" aria-label="选择星期">${weekDays.map((d,i)=>`<button type="button" class="up-week-day cursor-interaction ${i===4?'up-today':''}" data-class-day="${i}" aria-pressed="${day===i}">${d}<small>${16+i} 日${i===4?' · 今':''}</small></button>`).join('')}</div><div class="up-day-classes" aria-live="polite">${daily}</div><div class="up-class-detail" aria-live="polite">${detail}</div></section>`;
    }
    function taskList(){return state.tasks.map(t=>`<div class="up-task" data-done="${t.done}"><input class="cursor-interaction" id="up-task-${t.id}" type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><label class="cursor-interaction" for="up-task-${t.id}"><span class="up-task-name">${esc(t.title)}</span><span class="up-task-meta">${esc(t.meta)}</span></label><span class="up-tag">${t.done?'完成':esc(t.tag)}</span></div>`).join('');}
    function changePanel(){if(state.confirmed)return `<section class="up-panel"><div class="up-section-head"><h2>安排已同步</h2><span class="up-pill">已确认</span></div><p>机器学习考试 · 12 月 4 日 14:00</p><p class="up-subtitle">旧提醒已失效，新提醒为 12 月 3 日 14:00。示例操作仅在本预览内生效。</p><button class="up-link cursor-interaction" data-go="notices">查看来源与变更记录</button></section>`;if(state.deferred&&state.page==='home')return `<section class="up-panel"><h2>还有 1 条变更等待你确认</h2><p class="up-subtitle">机器学习考试改期，可稍后在通知中心处理。</p><button class="up-link cursor-interaction" data-go="notices">查看待确认变更</button></section>`;return `<section class="up-panel up-warning"><div class="up-warning-label"><i data-lucide="git-compare-arrows" aria-hidden="true"></i>发现一条考试时间变更</div><h2 class="up-title-gap">机器学习 · 期末考试</h2><div class="up-diff"><div class="up-old"><span>原安排</span><strong>12 月 2 日 14:00</strong></div><div><span>新通知</span><strong>12 月 4 日 14:00</strong></div></div><p class="up-caption">地点 A101 不变 · 更新后同步调整考试提醒</p><div class="up-actions"><button class="up-btn up-primary cursor-interaction" data-action="confirm">确认改期</button><button class="up-btn cursor-interaction" data-action="defer">稍后处理</button><button class="up-link cursor-interaction" data-go="notices">查看依据</button></div></section>`;}
    function upcoming(){return `<section class="up-panel"><div class="up-section-head"><h2>近期安排</h2><button class="up-link cursor-interaction" data-go="calendar">全部日程</button></div><div class="up-event"><div class="up-event-date">23<small>11 月</small></div><div><div class="up-event-title">提交高等数学作业</div><div class="up-caption">截止 20:00 · 第 8 次作业</div></div></div><div class="up-event"><div class="up-event-date">25<small>11 月</small></div><div><div class="up-event-title">大学英语课堂小测</div><div class="up-caption">10:00 · 教学楼 C302</div></div></div><div class="up-event"><div class="up-event-date">${state.confirmed?'04':'02'}<small>12 月</small></div><div><div class="up-event-title">机器学习期末考试</div><div class="up-caption">14:00 · A101${state.confirmed?' · 已更新':' · 有待确认变更'}</div></div></div></section>`;}
    function chatPanel(full=false){let msgs=state.messages.length?state.messages:[{role:'bot',text:'你好，林同学。今天还有 '+state.tasks.filter(t=>!t.done).length+' 项待办。'+(state.confirmed?'考试改期已确认。':'另有一条考试改期需要你确认。')+'先从哪件事开始？'}];return `<section class="up-panel" aria-label="校园助手"><div class="up-chat-heading"><span class="up-assistant-mark"><i data-lucide="sparkles" aria-hidden="true"></i></span><div><h2>你的校园助手</h2><div class="up-caption">把事情交给我，留点时间给自己</div></div></div><div aria-live="polite">${msgs.slice(full?-8:-3).map(m=>`<div class="up-chat-message ${m.role==='user'?'up-user':'up-bot'}">${esc(m.text)}</div>`).join('')}</div><div class="up-chips"><button class="up-chip cursor-interaction" data-chat="近期有哪些考试？">近期考试</button><button class="up-chip cursor-interaction" data-chat="帮我安排复习">安排复习</button></div><form class="up-chat-form" id="up-chat-form"><input class="up-input" id="up-chat-input" aria-label="给校园助手发消息" placeholder="说说你接下来要做的事…" maxlength="200"><button class="up-btn up-primary cursor-interaction" type="submit" aria-label="发送消息"><i data-lucide="send" aria-hidden="true"></i></button></form><div class="up-caption" style="margin-top:8px">演示回复 · 可输入“添加任务：读第二章”</div></section>`;}
    function home(){const done=state.tasks.filter(t=>t.done).length;return '<div class="up-welcome">'+greeting('下午好，林同学','在中大的每一天，让学习与生活从容有序。')+'</div>'+`<div class="up-stats"><div class="up-stat"><div class="up-stat-label">今日待办</div><div class="up-stat-number">${state.tasks.length-done}<small>件事，慢慢来</small></div></div><div class="up-stat"><div class="up-stat-label">今日完成</div><div class="up-stat-number">${done}<small>每一步都算数</small></div></div><div class="up-stat"><div class="up-stat-label">待确认变更</div><div class="up-stat-number">${state.confirmed?0:1}<small>需要你决定</small></div></div></div>${timetable()}<div class="up-columns"><div class="up-stack">${changePanel()}<section class="up-panel"><div class="up-section-head"><h2>今天，做一点就好</h2><span class="up-caption">${done} / ${state.tasks.length} 已完成</span></div>${taskList()}</section></div><div class="up-stack up-right">${chatPanel()}${upcoming()}</div></div>`;}
    function notices(){return greeting('通知中心','每一次安排变化，都有迹可循。')+`<div class="up-notice-layout"><div class="up-stack"><section class="up-panel"><div class="up-section-head"><h2>交给 UniPulse 整理</h2><span class="up-pill">通知导入</span></div><label class="up-field" for="up-notice-text">通知原文</label><textarea class="up-input" id="up-notice-text" rows="5" maxlength="3000">${esc(state.draft||'【考试安排调整】教学一班机器学习期末考试由12月2日14:00调整至12月4日14:00，地点A101不变。')}</textarea><div class="up-actions"><button class="up-btn up-primary cursor-interaction" data-action="parse">预览提取结果</button><button class="up-btn cursor-interaction" data-action="old">试试旧通知</button></div><label class="up-field" for="up-file">或上传课程资料</label><input class="up-input" type="file" id="up-file" accept=".pdf,.docx,.png,.jpg,.jpeg"><p class="up-caption" style="margin-top:8px">交互预览仅展示文件名，内容不会上传或解析。</p><div id="up-file-result" class="up-caption" aria-live="polite"></div></section><section class="up-panel"><h2>来源依据</h2><div class="up-source">示例新通知 · 2026.11.20 发布\n“考试由12月2日14:00调整至12月4日14:00，地点A101不变。”</div><dl class="up-details"><dt>课程 / 班级</dt><dd>机器学习 / 教学一班</dd><dt>变更字段</dt><dd>开始时间</dd><dt>保持不变</dt><dd>地点 A101</dd></dl></section></div><div class="up-stack">${state.oldConflict?'<section class="up-panel up-warning"><h2>旧通知与当前信息冲突</h2><p class="up-subtitle">这份旧材料仍写着 12 月 2 日。较晚导入不代表较晚发布，系统保留当前安排，等待来源核对。</p></section>':''}${changePanel()}<section class="up-panel"><h2>变更记录</h2><div class="up-history-row"><span class="up-caption">原始安排 · 示例记录</span><p>机器学习期末考试 · 12 月 2 日 14:00 · A101</p></div>${state.confirmed?'<div class="up-history-row"><span class="up-caption">本次预览 · 已确认</span><p>考试改至 12 月 4 日 14:00；地点保留；旧提醒失效。</p></div>':'<p class="up-caption">改期等待确认，正式日程尚未修改。</p>'}</section></div></div>`;}
    function calendar(){return greeting('我的日程','课程、考试和截止日期，放在一起看。')+`<section class="up-panel"><div class="up-section-head"><h2>接下来的安排</h2><span class="up-caption">2026.11.20—12.04 · 示例</span></div><div class="up-calendar-row"><div class="up-caption">11 月 23 日</div><div><h3>高等数学 · 第 8 次作业</h3><p class="up-subtitle">截止 20:00 · 提交电子版</p></div><span class="up-tag">作业截止</span></div><div class="up-calendar-row"><div class="up-caption">11 月 25 日</div><div><h3>大学英语 · 课堂小测</h3><p class="up-subtitle">10:00 · C302 · Unit 5—6</p></div><span class="up-tag">测验</span></div><div class="up-calendar-row"><div class="up-caption">12 月 ${state.confirmed?'04':'02'} 日</div><div><h3>机器学习 · 期末考试</h3><p class="up-subtitle">14:00 · A101 · 教学一班</p><button class="up-link cursor-interaction" data-go="notices">${state.confirmed?'查看已确认的改期记录':'查看待确认的改期通知'}</button></div><span class="up-tag">${state.confirmed?'已更新':'待核对'}</span></div></section>`;}
    function courses(){return greeting('我的课程','课程资料和相关安排，都有自己的位置。')+`<div class="up-course-grid">${[{name:'机器学习',tag:'教学一班',text:'已导入教学大纲 · 1 场考试',next:'12 月 '+(state.confirmed?'4':'2')+' 日 14:00'},{name:'高等数学',tag:'必修课',text:'已导入课程安排 · 1 项作业',next:'11 月 23 日 20:00 截止'},{name:'大学英语',tag:'必修课',text:'示例通知 · 1 场小测',next:'11 月 25 日 10:00'}].map(c=>`<section class="up-panel"><span class="up-pill">${c.tag}</span><h2 class="up-course-name">${c.name}</h2><p class="up-caption">${c.text}</p><p style="margin-top:16px">${c.next}</p><button class="up-link cursor-interaction" data-go="calendar">查看相关安排</button></section>`).join('')}<section class="up-panel"><h2>添加一门课程</h2><p class="up-subtitle">导入教学大纲，校对后建立课程档案。</p><div class="up-actions"><button class="up-btn cursor-interaction" data-go="notices">导入课程资料</button></div></section></div>`;}
    function settings(){return greeting('提醒设置','提醒的节奏，由你决定。')+`<section class="up-panel"><h2>我的提醒偏好</h2><label class="up-setting"><span><h3>开启免打扰</h3><span class="up-caption">22:30—08:00，非紧急提醒顺延</span></span><input class="cursor-interaction" data-setting="quiet" type="checkbox" ${state.quiet?'checked':''}></label><label class="up-setting"><span><h3>温和跟进</h3><span class="up-caption">每任务每天最多跟进一次，完成后停止</span></span><input class="cursor-interaction" data-setting="followup" type="checkbox" ${state.followup?'checked':''}></label><label class="up-setting"><span><h3>默认考试提醒</h3><span class="up-caption">修改后用于后续新建提醒</span></span><select class="up-input" data-setting="advance">${['提前 1 天','提前 2 小时','不主动提醒'].map(x=>`<option ${state.advance===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="up-setting"><span><h3>助手语气</h3><span class="up-caption">选择你喜欢的相处方式</span></span><select class="up-input" data-setting="tone">${['简洁','陪伴'].map(x=>`<option ${state.tone===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="up-setting"><span><h3>提醒渠道</h3><p class="up-caption">企业微信 · 本预览尚未连接</p></span><span class="up-pill">待接入</span></div></section>`;}
    function render(){root.querySelector('#up-breadcrumb').textContent=labels[state.page];root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});root.querySelectorAll('[data-pending]').forEach(e=>{e.textContent=state.confirmed?'0':'1';e.hidden=state.confirmed;});view.innerHTML=state.page==='home'?home():state.page==='notices'?notices():state.page==='calendar'?calendar():state.page==='courses'?courses():state.page==='settings'?settings():greeting('AI 助手','一句话，开始整理你的校园生活。')+chatPanel(true);icons();}
    function chat(text){const t=text.trim().slice(0,200);if(!t)return;let answer;if(/^添加任务[：:]/.test(t)){const title=t.replace(/^添加任务[：:]\s*/,'').trim();if(!title)answer='请补充任务内容，例如“添加任务：读第二章”。';else if(state.tasks.length>=12)answer='预览最多展示 12 项任务。';else{state.tasks.push({id:Date.now(),title,meta:'手动添加 · 提醒时间待设置',tag:'待安排',done:false});answer='已在本预览中添加“'+title+'”。尚未设置提醒时间，可到今日概览查看。';}}else if(/考试|日程/.test(t))answer='当前已保存：机器学习期末考试，12 月 '+(state.confirmed?'4':'2')+' 日 14:00，A101。'+(state.confirmed?'改期已确认。':'另有 12 月 4 日的改期通知待确认，原日程暂未修改。');else if(/复习/.test(t))answer='示例计划建议：先复习第三章（40 分钟），再整理错题（25 分钟）。正式版会先了解你的可用时间，确认后创建任务。';else answer='这版先演示页面与任务操作。你可以查看“近期考试”，或输入“添加任务：读第二章”。正式版将在这里接入模型和业务工具。';state.messages.push({role:'user',text:t},{role:'bot',text:answer});state.messages=state.messages.slice(-8);render();save();}
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)go(b.dataset.page);if(b.dataset.go)go(b.dataset.go);if(b.id==='up-import')go('notices');if(b.dataset.chat)chat(b.dataset.chat);const a=b.dataset.action;if(a==='confirm'){state.confirmed=true;state.deferred=false;render();save();toast('本预览已同步改期：12 月 4 日 14:00。旧提醒失效，新提醒为 12 月 3 日 14:00。');}if(a==='defer'){state.deferred=true;go('home');toast('已暂缓处理，原日程保持不变。');}if(a==='old'){state.oldConflict=true;render();save();toast('已演示旧通知冲突：没有覆盖当前日程。');}if(a==='parse'){const t=root.querySelector('#up-notice-text').value;state.draft=t;save();if(/机器学习/.test(t)&&/12月4日/.test(t))toast(state.confirmed?'示例改期已确认；重复导入不再次修改。':'已展示这条预置示例的字段和差异，等待确认。');else toast('已保留为本地预览草稿。自由文本解析将在正式版接入，当前不会生成虚构结果。');}});
    root.addEventListener('change',e=>{const el=e.target;if(el.dataset.task){const t=state.tasks.find(x=>x.id===Number(el.dataset.task));if(t){t.done=el.checked;render();save();toast(t.done?'已在预览中完成“'+t.title+'”，关联提醒将停止。':'已恢复为待办任务。');}}if(el.dataset.setting){state[el.dataset.setting]=el.type==='checkbox'?el.checked:el.value;save();toast('已更新本预览的提醒偏好。');}if(el.id==='up-file'){const out=root.querySelector('#up-file-result');out.textContent=el.files[0]?'已选择：'+el.files[0].name+'（未上传）':'';}});
    root.addEventListener('submit',e=>{if(e.target.id==='up-chat-form'){e.preventDefault();chat(root.querySelector('#up-chat-input').value);}});
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-class-day')){state.timetableDay=Number(b.dataset.classDay);state.selectedClass=null;render();save();}if(b.dataset.class){state.selectedClass=b.dataset.class;render();save();}});
    function applyDesign(){root.style.setProperty('--up-accent',ui.accent);root.style.setProperty('--up-radius',ui.radius+'px');}
    render();applyDesign();
    window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){state=restore(e.detail.globals.widgetState);render();}});
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{applyDesign();save();}});tweak.addColorPicker(ui,'accent',{label:'强调色',reference:'--up-accent'});tweak.addSlider(ui,'radius',{label:'卡片圆角',min:6,max:26,unit:'px',reference:'--up-radius'});}
  })();
  </script>
</div>
